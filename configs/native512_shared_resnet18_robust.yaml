data_mode: native512
data_manifest: Manifests/patch_manifest.csv

shared_encoder:
  backbone: resnet18
  pretrained: true
  trainable: layer4
  freeze_bn: true
  encoder_lr: 1.0e-5

classification:
  embedding_dim: 256
  attention_hidden_dim: 128
  topk: 5
  region_dropout: 0.2
  attention_dropout: 0.2
  projection_dropout: 0.2
  classifier_dropout: 0.4
  head_lr: 2.0e-4

metasr:
  scale: 16
  rgb_range: 1
  channels: 64
  residual_scale: 0.1
  dropout: 0.05
  hr_tile: 256

lambda_sr: 0.05
sr_train_crop: 128
sr_lr: 1.0e-4

training:
  use_region_microbatch: true
  region_microbatch_size: 2
  max_train_regions: 24
  class_weight: balanced

precision: bf16
optimizer: adamw
lr: 2.0e-4
weight_decay: 0.01
label_smoothing: 0.1
gradient_clip_norm: 1.0
epochs: 60
min_epochs: 5
early_stopping_patience: 12
early_stopping_min_delta: 1.0e-3
checkpoint_metric: val_auc
scheduler: plateau
scheduler_patience: 4
scheduler_factor: 0.5
min_lr: 1.0e-6
ema_decay: 0.999
seed: 1

augmentation:
  enabled: true
  horizontal_flip: 0.5
  vertical_flip: 0.5
  rotation90: true
  brightness: 0.15
  contrast: 0.15
  saturation: 0.10
  hue: 0.01
