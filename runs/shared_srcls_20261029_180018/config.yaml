data_mode: native512
data_manifest: Manifests/patch_manifest.csv
mil_pooling: abmil
classification_head: linear
embed_dropout: 0.3
mil_dropout: 0.3
metasr:
  scale: 16
  lr_chunk_size: 256
  checkpoint_rdb: true
  rgb_range: 1
  rdn_blocks: 1
  freeze_meanshift: true
lambda_sr: 0.05
sr_train_crop: 128
training:
  use_region_microbatch: true
  region_microbatch_size: 4
  label_smoothing: 0.05
  region_dropout: 0.1
  grad_clip: 1.0
precision: bf16
lr: 0.0001
weight_decay: 0.0005
epochs: 60
early_stopping_patience: 12
seed: 1
augmentation:
  enabled: true
  horizontal_flip: 0.5
  vertical_flip: 0.5
  rotation90: true
lr_scheduler: cosine
warmup_epochs: 3
min_lr: 1.0e-06
